name: Promote validated article

on:
  workflow_run:
    workflows:
      - "Validate article candidate"
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: article-promotion
  cancel-in-progress: false

jobs:
  promote:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      startsWith(github.event.workflow_run.head_branch, 'publish/')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CANDIDATE_BRANCH: ${{ github.event.workflow_run.head_branch }}
      CANDIDATE_SHA: ${{ github.event.workflow_run.head_sha }}

    steps:
      - name: Check out trusted main
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch current main and candidate metadata
        shell: bash
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags origin "+refs/heads/${CANDIDATE_BRANCH}:refs/remotes/origin/article-candidate"

      - name: Recheck validated article scope
        shell: bash
        run: |
          fetched_sha="$(git rev-parse refs/remotes/origin/article-candidate)"
          if [[ "$fetched_sha" != "$CANDIDATE_SHA" ]]; then
            printf 'Candidate branch changed after validation. Expected %s, found %s.\n' "$CANDIDATE_SHA" "$fetched_sha"
            exit 1
          fi

          ahead="$(git rev-list --count origin/main.."$CANDIDATE_SHA")"
          behind="$(git rev-list --count "$CANDIDATE_SHA"..origin/main)"
          if [[ "$ahead" != "1" || "$behind" != "0" ]]; then
            printf 'Validated candidate is no longer exactly one commit ahead of main (ahead=%s, behind=%s).\n' "$ahead" "$behind"
            exit 1
          fi

          mapfile -t changed_files < <(git diff --name-status --no-renames origin/main..."$CANDIDATE_SHA")
          if (( ${#changed_files[@]} != 1 )); then
            printf 'Expected exactly one changed article file; found %s.\n' "${#changed_files[@]}"
            printf '%s\n' "${changed_files[@]}"
            exit 1
          fi

          change_status="${changed_files[0]%%$'\t'*}"
          article_path="${changed_files[0]#*$'\t'}"
          if [[ "$change_status" != "A" && "$change_status" != "M" ]]; then
            printf 'Validated articles may only add or modify a file. Found status: %s\n' "$change_status"
            exit 1
          fi
          if [[ ! "$article_path" =~ ^src/content/articles/[0-9]{4}/[0-9]{2}/[a-z0-9][a-z0-9-]*\.md$ ]]; then
            printf 'Promotion accepts only one Markdown article under src/content/articles/YYYY/MM/. Found: %s\n' "$article_path"
            exit 1
          fi

          read -r file_mode object_type _ < <(git ls-tree "$CANDIDATE_SHA" -- "$article_path")
          if [[ "$file_mode" != "100644" || "$object_type" != "blob" ]]; then
            printf 'Validated article must be a regular 100644 Git blob. Found mode=%s type=%s\n' "$file_mode" "$object_type"
            exit 1
          fi

      - name: Fast-forward validated article to main
        run: git push origin "${CANDIDATE_SHA}:refs/heads/main"

      - name: Remove published candidate branch
        continue-on-error: true
        run: git push origin --delete "${CANDIDATE_BRANCH}"

      - name: Write publication summary
        run: |
          echo "## Article publication passed" >> "$GITHUB_STEP_SUMMARY"
          echo "The separately validated article commit was fast-forwarded to main for Cloudflare Pages." >> "$GITHUB_STEP_SUMMARY"
