name: Validate article candidate

on:
  push:
    branches:
      - "publish/**"

permissions:
  contents: read

concurrency:
  group: article-publication
  cancel-in-progress: false

jobs:
  validate-and-publish:
    if: github.event.deleted == false
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out candidate
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Fetch current main
        run: git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main

      - name: Require one article-only change
        shell: bash
        run: |
          ahead="$(git rev-list --count origin/main..HEAD)"
          behind="$(git rev-list --count HEAD..origin/main)"

          if [[ "$ahead" != "1" || "$behind" != "0" ]]; then
            printf 'Candidate must be exactly one commit ahead of current main (ahead=%s, behind=%s). Recreate it from current main.\n' "$ahead" "$behind"
            exit 1
          fi

          mapfile -t changed_files < <(git diff --name-status --no-renames origin/main...HEAD)

          if (( ${#changed_files[@]} != 1 )); then
            printf 'Expected exactly one changed article file; found %s.\n' "${#changed_files[@]}"
            printf '%s\n' "${changed_files[@]}"
            exit 1
          fi

          change_status="${changed_files[0]%%$'\t'*}"
          article_path="${changed_files[0]#*$'\t'}"
          if [[ "$change_status" != "A" && "$change_status" != "M" ]]; then
            printf 'Article candidates may only add or modify a file. Found status: %s\n' "$change_status"
            exit 1
          fi
          if [[ ! "$article_path" =~ ^src/content/articles/[0-9]{4}/[0-9]{2}/[a-z0-9][a-z0-9-]*\.md$ ]]; then
            printf 'CI publication accepts only one Markdown article under src/content/articles/YYYY/MM/. Found: %s\n' "$article_path"
            exit 1
          fi

          read -r file_mode object_type _ < <(git ls-tree HEAD -- "$article_path")
          if [[ "$file_mode" != "100644" || "$object_type" != "blob" ]]; then
            printf 'Article candidate must be a regular 100644 Git blob. Found mode=%s type=%s\n' "$file_mode" "$object_type"
            exit 1
          fi

          printf 'Validated candidate scope: %s\n' "$article_path"

      - name: Install pnpm
        uses: pnpm/action-setup@f520eceda224fe1a4aed5a2a27a194379a409996 # v6

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run complete production build
        run: pnpm run build

      - name: Write validation summary
        run: |
          echo "## Article validation passed" >> "$GITHUB_STEP_SUMMARY"
          echo "The candidate is exactly one article commit ahead of main and passed the complete production build." >> "$GITHUB_STEP_SUMMARY"
